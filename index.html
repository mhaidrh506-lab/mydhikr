<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173D2F">
<meta name="description" content="ذكر — تطبيق الأذكار، السبحة الذكية، مواقيت الصلاة، القرآن الكريم والقبلة">
<title>ذكر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="shortcut icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ذكر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAF7F0;
  --surface:#FFFFFF;
  --green-900:#0F2A21;
  --green-800:#173D2F;
  --green-700:#215541;
  --green-600:#2F6E4F;
  --green-100:#E7F0E9;
  --green-50:#F2F7F3;
  --gold-600:#B8872E;
  --gold-500:#C9A23C;
  --gold-300:#DDBB6B;
  --gold-100:#F3E8CB;
  --text:#20241F;
  --text-muted:#6E7268;
  --text-soft:#98988E;
  --danger:#B3452F;
  --radius-card:18px;
  --radius-ctrl:14px;
  --shadow-card: 0 1px 2px rgba(15,42,33,.04), 0 8px 24px rgba(15,42,33,.06);
  --tabbar-bg: rgba(250,247,240,.92);
  --tabbar-border: rgba(15,42,33,.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--ivory);}
body{
  font-family:'Tajawal', system-ui, sans-serif;
  color:var(--text);
  overscroll-behavior-y:none;
  -webkit-user-select:none;
  user-select:none;
}
input,textarea{ -webkit-user-select:text; user-select:text; }
.scripture{ font-family:'Amiri','Tajawal',serif; }
button{font-family:inherit;}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--ivory);
  position:relative;
  padding-bottom:calc(84px + var(--safe-bottom));
}

.screen{display:none; animation:fadeIn .28s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.topbar{
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:calc(18px + var(--safe-top)) 20px 14px;
}
.topbar h1{font-size:22px; font-weight:700; margin:0;}
.topbar .sub{font-size:13px; color:var(--text-muted); margin-top:2px;}
.clock{font-size:19px; font-weight:800; color:var(--gold-600); letter-spacing:1px; margin-top:6px; font-variant-numeric:tabular-nums;}
html[data-theme="dark"] .clock{ color:var(--gold-300); }
.dates-row{font-size:12px; color:var(--text-muted); margin-top:4px; display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
.dates-row .sep{color:var(--text-soft);}
.brand-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.brand-row .brand-mark{width:46px; height:46px; border-radius:13px; display:block;}
.brand-row .word{font-size:16px; font-weight:800; color:var(--gold-600); letter-spacing:.4px;}
html[data-theme="dark"] .brand-row .word{ color:var(--gold-300); }
.icon-btn{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--green-100); color:var(--green-700);
  border:none; font-size:18px; cursor:pointer;
}
.icon-btn:active{transform:scale(.94);}

.card{
  background:var(--surface);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  padding:18px 18px;
  margin:0 16px 14px;
}
.section-label{
  font-size:13px; font-weight:700; color:var(--green-700);
  margin:22px 20px 10px; letter-spacing:.2px;
}

/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:var(--tabbar-bg);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--tabbar-border);
  display:flex;
  padding-bottom:var(--safe-bottom);
  z-index:50;
}
.tab{
  flex:1; border:none; background:none; padding:10px 0 8px; margin:6px 4px 0;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--text-soft); font-size:11px; cursor:pointer;
  border-radius:14px; transition:background .18s ease;
}
.tab .dot{
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  position:relative;
}
.tab-badge{
  position:absolute; top:-4px; left:-6px;
  min-width:16px; height:16px; padding:0 4px;
  background:#ef4444; color:#fff;
  border-radius:999px;
  font-size:10px; font-weight:800; line-height:16px; text-align:center;
  box-shadow:0 0 0 2px var(--tabbar-bg);
}
.tab.active{color:var(--green-800); font-weight:700; background:var(--gold-100);}
.tab.active .dot{color:var(--green-800);}

/* ---------- for-you: fullscreen TikTok-style feed ---------- */
.foryou-feed{
  position:absolute; top:0; left:0; right:0;
  bottom:calc(84px + var(--safe-bottom));
  overflow-y:auto; overflow-x:hidden;
  scroll-snap-type:y mandatory;
  background:#000;
  -webkit-overflow-scrolling:touch;
}
.foryou-feed::-webkit-scrollbar{display:none;}
.foryou-item{
  position:relative; width:100%; height:100%;
  scroll-snap-align:start; scroll-snap-stop:always;
  background:#000; overflow:hidden;
}
.foryou-item video{
  width:100%; height:100%; object-fit:cover; display:block; background:#000;
}
.foryou-caption-scrim{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,.15) 22%, rgba(0,0,0,0) 42%),
             linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%);
}
.foryou-caption{
  position:absolute; right:16px; left:16px;
  bottom:calc(20px + var(--safe-bottom));
  color:#fff; font-size:14px; font-weight:700;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
  z-index:2;
}
.foryou-topbrand{
  position:absolute; top:calc(14px + var(--safe-top)); right:18px; left:18px;
  z-index:2; display:flex; align-items:center; justify-content:space-between;
  pointer-events:none;
}
.foryou-topbrand .word{color:#fff; font-weight:800; font-size:15px; text-shadow:0 1px 6px rgba(0,0,0,.5);}
.foryou-mute-btn{
  pointer-events:auto;
  width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(0,0,0,.4); color:#fff; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}
.foryou-mute-btn:active{transform:scale(.92);}
.foryou-actions{
  position:absolute; left:12px;
  bottom:calc(60px + var(--safe-bottom));
  z-index:2; display:flex; flex-direction:column; align-items:center; gap:18px;
}
.foryou-action-btn{
  pointer-events:auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:#fff; padding:0;
}
.foryou-action-btn .foryou-action-icon{
  width:42px; height:42px; border-radius:50%;
  background:rgba(0,0,0,.35); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease;
}
.foryou-action-btn:active .foryou-action-icon{transform:scale(.88);}
.foryou-action-btn.liked .foryou-action-icon{color:#ef4444;}
.foryou-action-count{
  font-size:11.5px; font-weight:700; color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.foryou-empty-wrap{
  position:absolute; top:0; left:0; right:0;
  bottom:calc(84px + var(--safe-bottom));
  display:flex; align-items:center; justify-content:center; padding:20px;
}

/* ---------- home: next-prayer ring ---------- */
.prayer-hero{
  margin:0 16px 14px; border-radius:var(--radius-card);
  background:linear-gradient(180deg, var(--green-800), var(--green-900));
  color:#fff; padding:22px 20px 42px; box-shadow:var(--shadow-card);
  position:relative; overflow:hidden;
}
.hero-pattern{position:absolute; inset:0; width:100%; height:100%; z-index:0;}
.prayer-hero .row, .prayer-hero .times-strip{position:relative; z-index:1;}
.hero-adhan-btn{
  position:absolute; top:14px; left:14px; z-index:2;
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.16); border:none; color:#fff; font-size:15px; cursor:pointer;
}
.hero-adhan-btn:active{transform:scale(.92);}
.prayer-hero .row{display:flex; align-items:center; justify-content:space-between; gap:16px;}
.prayer-hero .name{font-size:15px; color:var(--gold-300); font-weight:700;}
.prayer-hero .time{font-size:34px; font-weight:900; margin-top:2px;}
.prayer-hero .countdown{font-size:13px; color:rgba(255,255,255,.72); margin-top:6px;}
.ring-wrap{width:78px; height:78px; position:relative; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:rgba(255,255,255,.14); stroke-width:6;}
.ring-fg{fill:none; stroke:var(--gold-500); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .4s;}
.ring-wrap .center{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#fff;
}

.times-strip{display:flex; margin-top:18px; border-top:1px solid rgba(255,255,255,.12); padding-top:14px; gap:2px;}
.times-strip .item{flex:1; text-align:center;}
.times-strip .item .n{font-size:11px; color:rgba(255,255,255,.6);}
.times-strip .item .t{font-size:13px; font-weight:700; margin-top:3px;}
.times-strip .item.now .n{color:var(--gold-300);}
.times-strip .item.now .t{color:var(--gold-300);}

/* beads progress — signature motif */
.beads-row{display:flex; gap:5px; flex-wrap:wrap;}
.bead{
  width:9px; height:9px; border-radius:50%;
  background:var(--green-100); flex-shrink:0;
  transition:background .2s, transform .2s;
}
.bead.lit{background:var(--gold-500);}

.wird-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0;}
.wird-item + .wird-item{border-top:1px solid var(--green-50);}
.wird-item .label{font-size:14px; font-weight:500;}
.wird-item .val{font-size:12px; color:var(--text-muted);}
.wird-item .check{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px;}
.wird-item .check.done{background:var(--green-600); color:#fff;}
.wird-item .check.pending{background:var(--green-50); color:var(--text-soft);}

.dhikr-suggest{
  display:flex; align-items:center; gap:12px;
  background:var(--green-50); border-radius:var(--radius-ctrl); padding:14px 16px;
  margin:0 16px 14px;
}
.dhikr-suggest.floaty{
  background:var(--surface); margin:-26px 20px 16px; box-shadow:var(--shadow-card);
  border:1px solid var(--gold-100); position:relative; z-index:2;
}
.dhikr-suggest .txt .k{font-size:11px; color:var(--green-700); font-weight:700; transition:opacity .22s ease;}
.dhikr-suggest .txt .v{font-size:15px; margin-top:2px; transition:opacity .22s ease;}

.cta{
  display:block; width:calc(100% - 32px); margin:6px 16px 18px;
  background:var(--green-800); color:#fff; border:none;
  padding:15px; border-radius:var(--radius-ctrl); font-size:15px; font-weight:700;
  cursor:pointer;
}
.cta:active{transform:scale(.98);}
.cta.gold{background:var(--gold-500); color:var(--green-900);}
@keyframes drawBorderRect{
  0%{ stroke-dasharray:100; stroke-dashoffset:100; }
  70%{ stroke-dasharray:100; stroke-dashoffset:0; }
  100%{ stroke-dasharray:100; stroke-dashoffset:0; }
}
.draw-border-rect{
  stroke-dasharray:100; stroke-dashoffset:100;
  animation:drawBorderRect 7.5s ease-in-out infinite;
}
@keyframes colorWaveCycle{
  0%{ color:#173D2F; }
  16.66%{ color:#7B1E1E; }
  33.33%{ color:#1E3A5F; }
  50%{ color:#4A1942; }
  66.66%{ color:#1f8a4c; }
  83.33%{ color:#8B4513; }
  100%{ color:#173D2F; }
}
.color-wave-letter{
  display:inline;
  animation-name:colorWaveCycle;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
.cta.ghost{background:var(--green-50); color:var(--green-800);}

/* ---------- tasbih ---------- */
.tasbih-select{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 14px; -ms-overflow-style:none; scrollbar-width:none;}
.tasbih-select::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:9px 16px; border-radius:999px; border:1px solid var(--green-100);
  background:var(--surface); font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer;
}
.chip.active{background:var(--green-800); color:#fff; border-color:var(--green-800);}

.counter-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 20px 6px;}
.counter-dial{
  width:250px; height:250px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  cursor:pointer; position:relative; flex-shrink:0;
}
.counter-dial:active{transform:scale(.97);}
.counter-dial.novibrate:active{transform:none;}
.counter-dial .ring{position:absolute; inset:8px;}
.counter-dial .ring svg{width:100%; height:100%; transform:rotate(-90deg);}

.counter-dial.classic{
  background:var(--surface); box-shadow:var(--shadow-card); border:none;
}
.counter-dial.classic .label{font-size:13px; font-weight:700; color:var(--gold-600); letter-spacing:.3px; margin-bottom:2px;}
.counter-dial.classic .num{font-size:64px; font-weight:900; color:var(--green-800);}
.counter-dial.classic .target{font-size:14px; color:var(--text-muted); margin-top:4px;}
html[data-theme="dark"] .counter-dial.classic{ border:1px solid rgba(255,255,255,.06); }
html[data-theme="dark"] .counter-dial.classic .label{ color:var(--gold-300); }
html[data-theme="dark"] .counter-dial.classic .num{ color:var(--mint); }

.counter-dial.electronic{
  background:radial-gradient(circle at 32% 26%, #3a423d, #121c17 72%);
  box-shadow:0 12px 28px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.10), inset 0 -8px 16px rgba(0,0,0,.55);
  border:6px solid #232f29;
}
.counter-dial.electronic::before{
  content:''; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  width:36px; height:18px; border:4px solid #232f29; border-bottom:none; border-radius:16px 16px 0 0;
}
.counter-dial.electronic .lcd{
  background:#081711; border-radius:20px; padding:14px 24px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.65), inset 0 0 0 1px rgba(124,255,178,.08);
  display:flex; flex-direction:column; align-items:center; position:relative; z-index:1;
}
.counter-dial.electronic .label{font-size:11px; font-weight:700; color:#6FA98C; letter-spacing:1.2px; margin-bottom:2px; font-family:'Tajawal',sans-serif;}
.counter-dial.electronic .num{font-size:58px; font-weight:800; color:#7CFFB2; font-family:'Courier New',monospace; letter-spacing:2px; text-shadow:0 0 12px rgba(124,255,178,.65), 0 0 3px rgba(124,255,178,.9);}
.counter-dial.electronic .target{font-size:12px; color:#4F8069; margin-top:2px; font-family:'Courier New',monospace; letter-spacing:.5px;}

.counter-dial.wood{
  width:280px; height:286px; background:none; border:none; box-shadow:none; border-radius:0;
}
.counter-dial.wood .wood-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none;
}
.counter-dial.wood .wood-screen{
  position:absolute; left:25%; top:24.8%; width:50.4%; height:19%;
  background:#949F92; border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
}
.counter-dial.wood .wood-screen .num{font-size:38px; font-weight:900; color:#20281f; font-family:'Courier New',monospace; letter-spacing:3px; line-height:1; text-shadow:0.5px 0.5px 0 rgba(255,255,255,.35), -0.5px -0.5px 0 rgba(0,0,0,.25);}

.counter-dial.strap{
  width:350px; height:506px; background:none; border:none; box-shadow:none; border-radius:0;
}
.counter-dial.strap .strap-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none;
}
.counter-dial.strap .strap-screen{
  position:absolute; left:56.93%; top:38.28%; width:26.99%; height:9.72%;
  transform:translate(-50%,-50%) rotate(-38.35deg);
  background:#c8cdc6; border-radius:10%;
  display:flex; align-items:center; justify-content:center; z-index:2;
}
.counter-dial.strap .strap-screen .num{font-size:22px; font-weight:900; color:#181e17; font-family:'Courier New',monospace; letter-spacing:2px; line-height:1; text-shadow:0.5px 0.5px 0 rgba(255,255,255,.35), -0.5px -0.5px 0 rgba(0,0,0,.25);}

.counter-dial.white{
  width:280px; height:354px; background:none; border:none; box-shadow:none; border-radius:0;
}
.counter-dial.white .white-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none;
}
.counter-dial.white .white-screen{
  position:absolute; left:30.26%; top:34.15%; width:38.46%; height:10.57%;
  display:flex; align-items:center; justify-content:center; z-index:2;
}

.counter-dial.black2{
  width:280px; height:340px; background:none; border:none; box-shadow:none; border-radius:0;
}
.counter-dial.black2 .black2-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none;
}
.counter-dial.black2 .black2-screen{
  position:absolute; left:26.79%; top:31.15%; width:44.91%; height:12.15%;
  display:flex; align-items:center; justify-content:center; z-index:2;
}

.tasbih-style-dd{position:relative;}
.tasbih-style-btn{
  display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
  background:var(--green-100); color:var(--green-700); border:none; font-size:12.5px; font-weight:700; cursor:pointer;
}
.tasbih-style-btn:active{transform:scale(.96);}
.tasbih-vibrate-btn{
  width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
  background:var(--green-100); color:var(--text-muted);
  display:flex; align-items:center; justify-content:center;
}
.tasbih-vibrate-btn.on{background:var(--green-800); color:#fff;}
.tasbih-vibrate-btn:active{transform:scale(.94);}
.tasbih-style-menu{
  position:absolute; top:calc(100% + 8px); left:0; z-index:60; min-width:160px;
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow-card); border:1px solid var(--green-100);
  padding:6px; display:none;
}
.tasbih-style-menu.open{display:block;}
.tasbih-style-menu button{
  width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  background:none; border:none; font-size:13px; color:var(--text); cursor:pointer; text-align:right; font-family:inherit;
}
.tasbih-style-menu button.active{background:var(--green-50); color:var(--green-800); font-weight:700;}
.tasbih-style-backdrop{position:fixed; inset:0; z-index:55;}
html[data-theme="dark"] .tasbih-style-menu{ border-color:rgba(255,255,255,.06); }
html[data-theme="dark"] .tasbih-style-menu button.active{ background:var(--green-100); color:var(--mint); }
html[data-theme="dark"] .tasbih-style-btn{ color:var(--mint); }
.tasbih-phrase-dd{position:relative; align-self:center;}
.tasbih-phrase-btn{
  display:flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px;
  background:var(--green-100); color:var(--green-800); border:none; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:var(--shadow-card);
}
.tasbih-phrase-btn:active{transform:scale(.97);}
.tasbih-phrase-menu{
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:60; min-width:230px; max-width:80vw;
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow-card); border:1px solid var(--green-100);
  padding:6px; display:none; max-height:280px; overflow-y:auto;
}
.tasbih-phrase-menu.open{display:block;}
.tasbih-phrase-menu button{
  width:100%; display:flex; align-items:center; padding:11px 14px; border-radius:10px;

        const token = await getToken(messaging, {vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg});

          notifPreAdhan: !!prefs.notifPreAdhan,
          notifAdhan: !!prefs.notifAdhan,
          updatedAt: Date.now()
        });
        return {ok:true, token};
      }catch(e){
        console.error('push register failed', e);
        return {ok:false, error:String(e)};
      }
    },
    async unregister(token){
      if(!token) return true;
      try{ await deleteDoc(doc(dbFs, 'pushSubscriptions', token)); return true; }
      catch(e){ return false; }
    }

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(w=>{
    const test = current ? current+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = w;
    }else{
      current = test;
    }
  });
  if(current) lines.push(current);
  return lines;
}
function drawStarShape(ctx, cx, cy, r){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const angle = (Math.PI/4)*i;
    const rad = i%2===0 ? r : r*0.5;
    const x = cx + rad*Math.cos(angle);
    const y = cy + rad*Math.sin(angle);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();
}
async function shareDhikrImage(mainText, subText){
  toast(isEn()?'Preparing image...':'جارِ تجهيز الصورة...');

    if(document.fonts && document.fonts.load){
      await document.fonts.load('700 60px Amiri');
      await document.fonts.load('700 40px Tajawal');
    }
  }catch(e){}

  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#173D2F');
  grad.addColorStop(1, '#0F2A21');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  const cell = 96;
  for(let y=-cell; y<H+cell; y+=cell){
    for(let x=-cell; x<W+cell; x+=cell){
      drawStarShape(ctx, x, y, cell*0.42);
    }
  }
  ctx.restore();

  ctx.strokeStyle = '#C9A23C';
  ctx.lineWidth = 4;
  ctx.strokeRect(40,40,W-80,H-80);
  ctx.strokeStyle = 'rgba(201,162,60,.5)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(56,56,W-112,H-112);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#DEB563';
  ctx.font = '64px sans-serif';
  ctx.fillText('🕌', W/2, 220);

  ctx.direction = 'rtl';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FAF7F0';
  ctx.font = '700 62px Amiri, serif';
  const maxTextWidth = W-200;
  let lines = wrapCanvasText(ctx, mainText, maxTextWidth);
  if(lines.length > 6){
    ctx.font = '700 46px Amiri, serif';
    lines = wrapCanvasText(ctx, mainText, maxTextWidth);
  }
  const lineHeight = lines.length>6 ? 72 : 96;
  const blockHeight = (lines.length-1)*lineHeight;
  const startY = H/2 - blockHeight/2;
  lines.forEach((line,i)=> ctx.fillText(line, W/2, startY + i*lineHeight));

  if(subText){
    ctx.direction = isEn() ? 'ltr' : 'rtl';
    ctx.font = '400 32px Tajawal, sans-serif';
    ctx.fillStyle = '#DDBB6B';
    ctx.fillText(subText, W/2, startY + blockHeight + lineHeight*0.85);
  }

  ctx.direction = 'ltr';
  ctx.font = '700 40px Tajawal, sans-serif';
  ctx.fillStyle = '#C9A23C';
  ctx.fillText(isEn() ? 'MyDhikr' : 'ذكر', W/2, H-100);

  canvas.toBlob(async (blob)=>{
    if(!blob){ toast(isEn()?'Could not create image':'تعذر إنشاء الصورة'); return; }
    const file = new File([blob], 'dhikr.png', {type:'image/png'});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      try{
        await navigator.share({files:[file], title: isEn()?'MyDhikr':'ذكر'});
      }catch(e){}
    }else{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'dhikr.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast(isEn()?'Image saved':'تم حفظ الصورة');
    }
  }, 'image/png', 0.95);
}

/* ---- IndexedDB storage for the user's custom uploaded adhan ---- */
const IDB_NAME = 'dhikr_media', IDB_STORE = 'audio';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSaveCustomAdhan(blob, filename){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({blob, filename}, 'customAdhan');
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetCustomAdhan(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get('customAdhan');
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDeleteCustomAdhan(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete('customAdhan');
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

const SEVEN_SEG_MAP = {
  '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
  '5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abcdfg'
};
function sevenSegDigit(ch, onColor, offColor, w, h){
  const segs = SEVEN_SEG_MAP[ch] || '';
  const on = (s)=> segs.includes(s) ? onColor : offColor;
  return `<span style="position:relative; display:inline-block; width:${w}px; height:${h}px; margin:0 4px; vertical-align:middle; transform:skewX(-10deg);">
    <span style="position:absolute; left:13%; top:1%; width:74%; height:16%; background:${on('a')}; border-radius:2px;"></span>
    <span style="position:absolute; left:81%; top:4%; width:16%; height:43%; background:${on('b')}; border-radius:2px;"></span>
    <span style="position:absolute; left:81%; top:52%; width:16%; height:43%; background:${on('c')}; border-radius:2px;"></span>
    <span style="position:absolute; left:13%; top:83%; width:74%; height:16%; background:${on('d')}; border-radius:2px;"></span>
    <span style="position:absolute; left:3%; top:52%; width:16%; height:43%; background:${on('e')}; border-radius:2px;"></span>
    <span style="position:absolute; left:3%; top:4%; width:16%; height:43%; background:${on('f')}; border-radius:2px;"></span>
    <span style="position:absolute; left:13%; top:42%; width:74%; height:16%; background:${on('g')}; border-radius:2px;"></span>
  </span>`;
}
function sevenSegNumber(numStr, onColor, offColor, w, h){
  let safe = Number(numStr);
  if(!Number.isFinite(safe) || safe < 0) safe = 0;
  safe = Math.floor(safe);
  return String(safe).split('').map(ch => sevenSegDigit(ch, onColor, offColor, w, h)).join('');
}

  let html = '';
  for(let i=0;i<Math.min(total,max);i++){

function haversineBearing(lat1,lon1,lat2,lon2){
  const toRad = d => d*Math.PI/180;
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  let brng = Math.atan2(y,x) * 180/Math.PI;
  return (brng + 360) % 360;
}

async function resolveLocationName(){
  if(LOCATION_NAME.text || LOCATION_NAME.loading) return LOCATION_NAME.text;
  LOCATION_NAME.loading = true;
  try{
    const coords = await getUserCoords();
    const lang = isEn() ? 'en' : 'ar';
    const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${coords.lat}&longitude=${coords.lng}&localityLanguage=${lang}`;
    const res = await fetch(url);
    const json = await res.json();
    const city = json.city || json.locality || json.principalSubdivision || '';
    const country = json.countryName || '';
    LOCATION_NAME.text = [city, country].filter(Boolean).join('، ');
    DB.settings.city = city;
    DB.settings.country = country;
    saveDB();
  }catch(e){
    LOCATION_NAME.error = true;
  }
  LOCATION_NAME.loading = false;
  return LOCATION_NAME.text;
}

async function getUserCoords(){
  if(DB.settings.lat && DB.settings.lng) return {lat:DB.settings.lat, lng:DB.settings.lng};
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(defaultCoords()); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      () => resolve(defaultCoords()),
      {timeout:8000}
    );
  });
}

async function loadPrayerTimes(force){
  const key = todayKey();
  if(!force && PRAYER.timings && PRAYER.date === key) return PRAYER;
  PRAYER.loading = true;
  try{
    const coords = await getUserCoords();
    PRAYER.coords = coords;
    const method = DB.settings.method || 4;
    const url = `https://api.aladhan.com/v1/timings?latitude=${coords.lat}&longitude=${coords.lng}&method=${method}`;
    const res = await fetch(url);
    const json = await res.json();
    PRAYER.timings = json.data.timings;
    PRAYER.date = key;
    PRAYER.error = null;
  }catch(e){
    PRAYER.error = 'تعذر جلب مواقيت الصلاة، تحقق من الاتصال';
  }
  PRAYER.loading = false;
  return PRAYER;
}

function parsePrayerTime(str, base){
  const clean = (str||'00:00').split(' ')[0];
  const [h,m] = clean.split(':').map(Number);
  const d = new Date(base);
  d.setHours(h, m, 0, 0);
  return d;
}

function getNextPrayer(now){
  if(!PRAYER.timings) return null;
  now = now || new Date();
  for(const key of NEXT_ORDER){
    const t = parsePrayerTime(PRAYER.timings[key], now);
    if(t > now) return {key, time:t};
  }
  const tomorrow = new Date(now.getTime() + 86400000);
  const t = parsePrayerTime(PRAYER.timings['Fajr'], tomorrow);
  return {key:'Fajr', time:t, tomorrow:true};
}

function currentPrayerKey(now){
  if(!PRAYER.timings) return null;
  now = now || new Date();
  let current = null;
  for(const key of PRAYER_ORDER){
    const t = parsePrayerTime(PRAYER.timings[key], now);
    if(t <= now) current = key; else break;
  }
  return current;
}

function timeOfDayPeriod(now){
  now = now || new Date();
  const h = now.getHours();
  const next = getNextPrayer(now);
  const cur = currentPrayerKey(now);
  if(cur === 'Isha' || h < 3) return 'sleep';
  if(cur === 'Fajr' || (h>=3 && h<7)) return 'morning';
  if(cur === 'Maghrib' || (h>=16 && h<19)) return 'evening';
  if(next && next.key==='Fajr' && h>=19) return 'evening';
  return 'day';
}

];
function dhikrRotationPool(){
  const now = new Date();
  const period = timeOfDayPeriod(now);
  const contextual = TIME_DHIKR[period] || TIME_DHIKR.day;
  if(now.getDay() === 5){
    return [contextual, ...FRIDAY_DHIKR];
  }
  return [contextual, ...DHIKR_POOL, ...FRIDAY_EXTRA_DHIKR];
}

let _homeTicker = null;
let _dhikrTimer = null;
let _dhikrIndex = 0;
function countWrappedLines(el){
  const style = getComputedStyle(el);
  let lineHeight = parseFloat(style.lineHeight);
  if(!lineHeight || isNaN(lineHeight)){
    lineHeight = parseFloat(style.fontSize) * 1.3;
  }
  return Math.max(1, Math.round(el.scrollHeight / lineHeight));
}
function dhikrDisplayDuration(lines){
  if(lines >= 3) return 10000;
  if(lines === 2) return 7000;
  return 5000;
}
function scheduleDhikrRotation(delay){
  clearTimeout(_dhikrTimer);
  _dhikrTimer = setTimeout(rotateDhikr, delay);
}
function rotateDhikr(){
  if(DB.ui.tab !== 'home') return;
  const pool = dhikrRotationPool();
  _dhikrIndex = (_dhikrIndex + 1) % pool.length;
  const item = pool[_dhikrIndex];
  const kEl = document.getElementById('dhikr-k');
  const vEl = document.getElementById('dhikr-v');
  if(!kEl || !vEl) return;
  kEl.style.opacity = 0; vEl.style.opacity = 0;
  setTimeout(()=>{
    const kEl2 = document.getElementById('dhikr-k');
    const vEl2 = document.getElementById('dhikr-v');
    if(!kEl2 || !vEl2) return;
    kEl2.textContent = item.k;
    vEl2.textContent = item.v;
    kEl2.style.opacity = 1; vEl2.style.opacity = 1;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const lines = countWrappedLines(vEl2);
        scheduleDhikrRotation(dhikrDisplayDuration(lines));
      });
    });
  }, 220);
}
function startDhikrRotation(){
  clearTimeout(_dhikrTimer);
  _dhikrIndex = 0;
  const vEl = document.getElementById('dhikr-v');
  const initialDelay = vEl ? dhikrDisplayDuration(countWrappedLines(vEl)) : 5000;
  scheduleDhikrRotation(initialDelay);
}

const DHIKR_TYPES = ['استغفر الله','سبحان الله وبحمده','سبحان الله العظيم','سبحان الله','الحمد لله','لا إله إلا الله','الله أكبر','لا حول ولا قوة إلا بالله','اللهم صل وسلم على نبينا محمد'];

function tasbihTodayCounts(){
  const k = todayKey();
  if(!DB.tasbih.counts || typeof DB.tasbih.counts !== 'object') DB.tasbih.counts = {};
  if(!DB.tasbih.counts[k] || typeof DB.tasbih.counts[k] !== 'object' || Array.isArray(DB.tasbih.counts[k])){
    DB.tasbih.counts[k] = {};
  }
  const dayCounts = DB.tasbih.counts[k];
  // normalize every dhikr entry into a clean {style: number} object
  for(const dk in dayCounts){
    const val = dayCounts[dk];
    if(typeof val === 'number'){
      dayCounts[dk] = Number.isFinite(val) ? { electronic: val } : {};
    }else if(!val || typeof val !== 'object' || Array.isArray(val)){
      dayCounts[dk] = {};
    }else{
      for(const sk in val){
        if(typeof val[sk] !== 'number' || !Number.isFinite(val[sk]) || val[sk] < 0){
          delete val[sk];
        }
      }
    }
  }
  return dayCounts;
}
function tasbihStyleCount(dhikr, style){
  const dayCounts = tasbihTodayCounts();
  if(!dayCounts[dhikr]) dayCounts[dhikr] = {};
  const v = dayCounts[dhikr][style];
  return Number.isFinite(v) ? v : 0;
}
function tasbihDhikrTotalToday(dhikr){
  const dayCounts = tasbihTodayCounts();
  const styles = dayCounts[dhikr] || {};
  return Object.values(styles).reduce((a,b)=>a+b, 0);
}
function tasbihCurrentCount(){
  const style = DB.settings.tasbihStyle || 'electronic';
  return tasbihStyleCount(DB.tasbih.selected, style);
}
function tasbihIncrement(){
  try{
    const key = DB.tasbih.selected;
    const style = DB.settings.tasbihStyle || 'electronic';
    const today = tasbihTodayCounts();
    if(!today[key] || typeof today[key] !== 'object' || Array.isArray(today[key])){
      today[key] = {};
    }
    const existing = today[key][style];
    const prevVal = (typeof existing === 'number' && Number.isFinite(existing) && existing >= 0) ? existing : 0;
    today[key][style] = prevVal + 1;
    DB.tasbih.allTime[key] = (Number.isFinite(DB.tasbih.allTime[key]) ? DB.tasbih.allTime[key] : 0) + 1;
    saveDB();
    if(DB.settings.tasbihVibrate) vibrate(12);
    const n = today[key][style];
    const goal = DB.tasbih.dailyGoal || 100;
    const numEl = document.getElementById('tasbih-num');
    if(numEl){
      if(style === 'wood') numEl.innerHTML = sevenSegNumber(n, '#20281f', 'rgba(32,40,31,.07)', 26, 44);
      else if(style === 'strap') numEl.innerHTML = sevenSegNumber(n, '#181e17', 'rgba(24,30,23,.07)', 20, 32);
      else if(style === 'white') numEl.innerHTML = sevenSegNumber(n, '#1c3320', 'rgba(28,51,32,.07)', 19, 30);
      else if(style === 'black2') numEl.innerHTML = sevenSegNumber(n, '#1c3320', 'rgba(28,51,32,.07)', 23, 37);
      else numEl.textContent = n;
    }
    const R = 108, C = 2*Math.PI*R;
    const ring = document.getElementById('tasbih-ring');
    if(ring){
      const pct = Math.min(1, n/goal);
      ring.setAttribute('stroke-dashoffset', C*(1-pct));
    }
    if(n === goal) toast(`حققت ${goal} تسبيحة`);
  }catch(e){
    try{
      const key = DB.tasbih.selected;
      const style = DB.settings.tasbihStyle || 'electronic';
      DB.tasbih.counts = DB.tasbih.counts || {};
      const k = todayKey();
      DB.tasbih.counts[k] = DB.tasbih.counts[k] || {};
      DB.tasbih.counts[k][key] = { [style]: 1 };
      saveDB();
    }catch(e2){}
    renderCurrentScreen();
  }
}

      </div>
      `}

        </button>
      </div>
    </div>
    ${_tasbihPhraseMenuOpen ? `<div class="tasbih-style-backdrop" onclick="closeTasbihPhraseMenu()"></div>` : ''}
  `;
}

function adhkarDayState(cat){
  const dk = todayKey();
  if(!DB.adhkar.progress[dk]) DB.adhkar.progress[dk] = {};
  if(!DB.adhkar.progress[dk][cat]) DB.adhkar.progress[dk][cat] = {};
  const state = DB.adhkar.progress[dk][cat];
  ADHKAR_DATA[cat].forEach(item=>{
    if(typeof state[item.id] !== 'number') state[item.id] = item.reps;
  });
  return state;
}
function adhkarCatDone(cat){
  const state = adhkarDayState(cat);
  return ADHKAR_DATA[cat].every(item => state[item.id] === 0);
}
function adhkarTap(cat, id){
  const state = adhkarDayState(cat);
  if(state[id] > 0) state[id]--;
  vibrate(10);
  const wasDone = adhkarCatDone(cat);
  if(wasDone){
    if(!DB.stats.categoryDoneLog) DB.stats.categoryDoneLog = {};
    if(!DB.stats.categoryDoneLog[cat]) DB.stats.categoryDoneLog[cat] = [];
    const dk = todayKey();
    if(!DB.stats.categoryDoneLog[cat].includes(dk)) DB.stats.categoryDoneLog[cat].push(dk);
  }
  saveDB();
  renderCurrentScreen();
}

function renderAdhkarGrid(){
  return `
    <div class="topbar"><div><h1>${t('tab_adhkar')}</h1><div class="sub">${t('adhkar_sub')}</div></div></div>

          </div>`;
      }).join('')}

  `;
}
let _adhkarIndex = 0;
function adhkarFirstUnfinishedIndex(cat){
  const items = ADHKAR_DATA[cat];
  const state = adhkarDayState(cat);
  for(let i=0;i<items.length;i++){
    if(state[items[i].id] > 0) return i;
  }
  return 0;
}
function renderAdhkarDetail(){
  const cat = DB.ui.adhkarCat;
  const catInfo = ADHKAR_CATS.find(c=>c.id===cat);
  const items = ADHKAR_DATA[cat];
  const state = adhkarDayState(cat);
  const doneCount = items.filter(i=>state[i.id]===0).length;

  const header = `
    <div class="back-row">
      <button class="back-btn" onclick="adhkarBackToGrid()">›</button>
      <div style="flex:1"><div style="font-weight:700; font-size:15px">${adhkarCatLabel(catInfo)}</div></div>
      <div style="font-size:12px; color:var(--text-muted)">${Math.min(_adhkarIndex+1, items.length)} / ${items.length}</div>
    </div>
    <div class="adhkar-progress">
      <div class="bar"><div class="fill" style="width:${Math.round(doneCount/items.length*100)}%; background:${catInfo.color}"></div></div>
    </div>
  `;

  if(doneCount === items.length){
    return header + `
      <div class="empty" style="padding:60px 24px;">
        <div style="font-size:40px; margin-bottom:10px; color:${catInfo.color}">✓</div>
        ${t('adhkar_all_done')} «${adhkarCatLabel(catInfo)}» ${t('adhkar_for_today')}
        <div style="margin-top:18px"><button class="chip" onclick="adhkarResetCategory('${cat}')">${t('restart_from_beginning')}</button></div>
      </div>
    `;
  }

  const idx = Math.min(_adhkarIndex, items.length-1);
  const item = items[idx];
  const remaining = state[item.id];

  return header + `
    <div class="adhkar-focus-card" onclick="adhkarFocusTap('${cat}')">
      <div class="arabic-big">${item.text}</div>
      ${item.note?`<div class="note">${item.note}</div>`:''}
    </div>
    <div class="adhkar-focus-counter">
      <div class="count-big ${remaining===0?'done':''}">${remaining}</div>
    </div>
    <div class="adhkar-focus-nav">
      <button onclick="adhkarFocusPrev()" ${idx===0?'disabled':''}>${t('prev')}</button>
      <button onclick="adhkarFocusReset('${cat}')">${t('reset')}</button>
      <button onclick="adhkarFocusNext('${cat}')" ${idx===items.length-1?'disabled':''}>${t('next')}</button>
    </div>
  `;
}
function adhkarFocusTap(cat){
  const items = ADHKAR_DATA[cat];
  const idx = Math.min(_adhkarIndex, items.length-1);
  const item = items[idx];
  const state = adhkarDayState(cat);
  if(state[item.id] <= 0) return;
  state[item.id]--;
  vibrate(10);
  const justFinished = state[item.id] === 0;
  if(justFinished && adhkarCatDone(cat)){
    if(!DB.stats.categoryDoneLog) DB.stats.categoryDoneLog = {};
    if(!DB.stats.categoryDoneLog[cat]) DB.stats.categoryDoneLog[cat] = [];
    const dk = todayKey();
    if(!DB.stats.categoryDoneLog[cat].includes(dk)) DB.stats.categoryDoneLog[cat].push(dk);
  }
  saveDB();
  renderCurrentScreen();
  if(justFinished && idx < items.length - 1){
    setTimeout(()=>{
      if(DB.ui.tab==='adhkar' && DB.ui.adhkarView==='detail' && _adhkarIndex===idx){
        _adhkarIndex = idx + 1;
        renderCurrentScreen();
      }
    }, 550);
  }
}
function adhkarFocusPrev(){
  if(_adhkarIndex > 0){ _adhkarIndex--; renderCurrentScreen(); }
}
function adhkarFocusNext(cat){
  const items = ADHKAR_DATA[cat];
  if(_adhkarIndex < items.length-1){ _adhkarIndex++; renderCurrentScreen(); }
}
function adhkarFocusReset(cat){
  const items = ADHKAR_DATA[cat];
  const idx = Math.min(_adhkarIndex, items.length-1);
  const item = items[idx];
  const state = adhkarDayState(cat);
  state[item.id] = item.reps;
  saveDB();
  renderCurrentScreen();
}
function adhkarResetCategory(cat){
  const items = ADHKAR_DATA[cat];
  const state = adhkarDayState(cat);
  items.forEach(it => state[it.id] = it.reps);
  _adhkarIndex = 0;
  saveDB();
  renderCurrentScreen();
}
function adhkarOpenCat(cat){
  DB.ui.adhkarCat = cat;
  DB.ui.adhkarView = 'detail';
  _adhkarIndex = adhkarFirstUnfinishedIndex(cat);
  saveDB();
  renderCurrentScreen();
}
function adhkarResetIfLeavingDetail(){
  if(DB.ui.tab === 'adhkar' && DB.ui.adhkarView === 'detail'){
    const cat = DB.ui.adhkarCat;
    if(cat && ADHKAR_DATA[cat]){
      const items = ADHKAR_DATA[cat];
      const state = adhkarDayState(cat);
      items.forEach(it => state[it.id] = it.reps);
    }
  }
}
function adhkarBackToGrid(){
  adhkarResetIfLeavingDetail();
  DB.ui.adhkarView = 'grid';
  saveDB();
  renderCurrentScreen();
}

function normalizeArabic(s){
  return (s||'')
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'')
    .replace(/[إأآاٱ]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .trim();
}
let _quranAyahSearchToken = 0;
async function quranRenderAyahResults(term){
  const container = document.getElementById('ayah-search-results');
  if(!container) return;
  const q = (term||'').trim();
  if(q.length < 2){ container.innerHTML = ''; return; }
  const myToken = ++_quranAyahSearchToken;
  container.innerHTML = `<div class="section-label">${t('ayah_results')}</div><div class="empty">${t('searching')}</div>`;
  let data;
  try{ data = await loadQuranData(); }
  catch(e){
    if(myToken !== _quranAyahSearchToken) return;
    container.innerHTML = `<div class="section-label">${t('ayah_results')}</div><div class="empty">${isEn()?'Could not load Quran data for search':'تعذر تحميل بيانات القرآن للبحث'}</div>`;
    return;
  }
  if(myToken !== _quranAyahSearchToken) return;
  const needle = normalizeArabic(q);
  const CAP = 30;
  const results = [];
  outer:
  for(const numStr of Object.keys(data)){
    const s = data[numStr];
    for(let i=0;i<s.ayahs.length;i++){
      if(normalizeArabic(s.ayahs[i]).includes(needle)){
        results.push({surah:parseInt(numStr,10), ayahNum:i+1, text:s.ayahs[i]});
        if(results.length >= CAP) break outer;
      }
    }
  }
  if(myToken !== _quranAyahSearchToken) return;
  if(!results.length){
    container.innerHTML = `<div class="section-label">${t('ayah_results')}</div><div class="empty">${t('no_ayah_results')}</div>`;
    return;
  }
  container.innerHTML = `
    <div class="section-label">${t('ayah_results')}${results.length>=CAP?(isEn()?' (first '+CAP+')':' (أول '+CAP+' نتيجة)'):''}</div>
    <div class="card" style="padding:4px 0">
      ${results.map(r=>`
        <div class="surah-row" onclick="quranOpenAt(${r.surah}, ${r.ayahNum})">
          <div class="surah-num">${r.ayahNum}</div>
          <div class="surah-info">
            <div class="name" dir="rtl">سورة ${(SURAHS.find(x=>x[0]===r.surah)||{})[1] || r.surah}</div>
            <div class="meta" style="font-family:'Amiri',serif; font-size:13px" dir="rtl">${r.text.length>70? r.text.slice(0,70)+'…' : r.text}</div>
          </div>
          <div style="color:var(--text-soft)">‹</div>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadQuranData(){
  if(QURAN_DATA) return QURAN_DATA;
  const res = await fetch('quran-data.json');
  if(!res.ok) throw new Error('http_' + res.status);
  QURAN_DATA = await res.json();
  return QURAN_DATA;
}
const _surahCache = {};
async function loadSurahText(num){
  if(QURAN_DATA && QURAN_DATA[String(num)]) return QURAN_DATA[String(num)];
  if(_surahCache[num]) return _surahCache[num];
  try{
    const res = await fetch(`quran-data/${num}.json`);
    if(!res.ok) throw new Error('http_' + res.status);
    const s = await res.json();
    if(!s || !Array.isArray(s.ayahs)) throw new Error('not_found');
    _surahCache[num] = s;
    return s;
  }catch(e){
    const data = await loadQuranData();
    const s = data[String(num)];
    if(!s || !Array.isArray(s.ayahs)) throw new Error('not_found');
    return s;
  }
}

/* ---- Quran surah audio playback (background-capable via persistent <audio> + Media Session) ---- */
let _quranTimerEnd = null;
let _quranTimerInterval = null;

function quranAudioUrl(reciterId, num, bitrate){
  bitrate = bitrate || 128;
  if(reciterId === 'ar.khalidaljleel'){
    return `https://server10.mp3quran.net/download/jleel/${String(num).padStart(3,'0')}.mp3`;
  }
  return `https://cdn.islamic.network/quran/audio-surah/${bitrate}/${reciterId}/${num}.mp3`;
}
const QURAN_BITRATE_FALLBACKS = [128, 64, 192, 32];
function playAudioWithBitrateFallback(audio, reciterId, num, onSuccess, onFinalFail){
  let i = 0;
  let settled = false;
  function tryNext(){
    if(i >= QURAN_BITRATE_FALLBACKS.length){
      if(!settled){ settled = true; audio.onerror = null; if(onFinalFail) onFinalFail(); }
      return;
    }
    const bitrate = QURAN_BITRATE_FALLBACKS[i];
    i++;
    audio.onerror = ()=>{ if(!settled) tryNext(); };
    audio.src = quranAudioUrl(reciterId, num, bitrate);
    audio.play().then(()=>{
      if(!settled){ settled = true; audio.onerror = null; if(onSuccess) onSuccess(); }
    }).catch(()=>{});
  }
  tryNext();
}
function quranReciterSet(id){
  DB.settings.quranReciter = id;
  saveDB();
  const audio = document.getElementById('quran-audio');
  const num = DB.ui.quranSurah;
  if(audio && audio.dataset.surah === String(num) && !audio.paused){
    playAudioWithBitrateFallback(audio, id, num, ()=>setQuranMediaSession(num), null);
  }
}
function quranAudioToggle(num){
  const audio = document.getElementById('quran-audio');
  if(!audio) return;
  const sameSurah = audio.dataset.surah === String(num) && audio.src;
  if(sameSurah && !audio.paused){
    audio.pause();
    updateQuranAudioUI();
    return;
  }
  if(sameSurah){
    audio.play().then(()=>setQuranMediaSession(num)).catch(()=>toast('تعذر تشغيل الصوت'));
    updateQuranAudioUI();
    return;
  }
  const reciter = DB.settings.quranReciter || 'ar.alafasy';
  audio.pause();
  audio.dataset.surah = String(num);
  playAudioWithBitrateFallback(audio, reciter, num,
    ()=>setQuranMediaSession(num),
    ()=>toast('تعذر تشغيل الصوت، تحقق من الاتصال بالإنترنت')
  );
  updateQuranAudioUI();
}
function setQuranMediaSession(num){
  if(!('mediaSession' in navigator)) return;
  const s = SURAHS.find(x=>x[0]===num);
  const reciterName = (RECITERS.find(r=>r.id===DB.settings.quranReciter)||{}).name || '';
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'سورة ' + (s ? s[1] : num),
      artist: reciterName,
      album: 'MyDhikr — القرآن الكريم'
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ const a=document.getElementById('quran-audio'); if(a) a.play(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ const a=document.getElementById('quran-audio'); if(a) a.pause(); });
  }catch(e){}
}
function updateQuranAudioUI(){
  const audio = document.getElementById('quran-audio');
  const btn = document.getElementById('quran-audio-play-btn');
  if(audio && btn){
    const isPlayingThis = audio.dataset.surah === String(DB.ui.quranSurah) && !audio.paused;
    btn.innerHTML = isPlayingThis ? stopIcon(18) : speakerIcon(20);
  }
}
function quranTimerSet(mins){
  const m = parseInt(mins, 10) || 0;
  if(_quranTimerInterval){ clearInterval(_quranTimerInterval); _quranTimerInterval = null; }
  if(m <= 0){
    _quranTimerEnd = null;
    updateQuranTimerLabel();
    return;
  }
  _quranTimerEnd = Date.now() + m*60000;
  updateQuranTimerLabel();
  _quranTimerInterval = setInterval(()=>{
    if(!_quranTimerEnd){ clearInterval(_quranTimerInterval); _quranTimerInterval = null; return; }
    const remain = _quranTimerEnd - Date.now();
    if(remain <= 0){
      const audio = document.getElementById('quran-audio');
      if(audio) audio.pause();
      _quranTimerEnd = null;
      clearInterval(_quranTimerInterval);
      _quranTimerInterval = null;
      updateQuranAudioUI();
      updateQuranTimerLabel();
      toast('توقف التشغيل — انتهى المؤقت 🌙');
      return;
    }
    updateQuranTimerLabel();
  }, 1000);
}
function updateQuranTimerLabel(){
  const el = document.getElementById('quran-audio-timer-label');
  if(!el) return;
  if(!_quranTimerEnd){ el.textContent = ''; return; }
  const remain = Math.max(0, _quranTimerEnd - Date.now());
  const mm = Math.floor(remain/60000);
  const ss = Math.floor((remain%60000)/1000);
  el.textContent = `يتوقف تلقائياً بعد ${mm}:${String(ss).padStart(2,'0')}`;
}

/* ============================== QIBLA ============================== */
const KAABA = {lat:21.4225, lng:39.8262};
let QIBLA = { bearing:null, heading:null, mode:'idle' };

function qiblaNeedleSVG(){
  return `<svg viewBox="0 0 100 100" width="100%" height="100%">
    <polygon points="50,10 60,55 50,48 40,55" fill="var(--gold-500)"></polygon>
    <polygon points="50,90 60,55 50,62 40,55" fill="var(--green-100)"></polygon>
    <text x="50" y="26" text-anchor="middle" font-size="11">🕋</text>
  </svg>`;
}

async function qiblaCompute(){
  const coords = await getUserCoords();
  QIBLA.bearing = haversineBearing(coords.lat, coords.lng, KAABA.lat, KAABA.lng);
  const el = document.getElementById('qibla-deg-val');
  if(el) el.textContent = Math.round(QIBLA.bearing) + '°';
  qiblaApplyRotation();
}
function qiblaApplyRotation(){
  const needle = document.getElementById('qibla-needle');
  if(!needle || QIBLA.bearing===null) return;
  const heading = QIBLA.heading || 0;
  const rel = (QIBLA.bearing - heading + 360) % 360;
  needle.style.transform = `rotate(${rel}deg)`;
}
function qiblaOrientationHandler(e){
  let heading;
  if(typeof e.webkitCompassHeading === 'number'){
    heading = e.webkitCompassHeading;
  }else if(e.alpha !== null){
    heading = (360 - e.alpha) % 360;
  }else return;
  QIBLA.heading = heading;
  QIBLA.mode = 'live';
  qiblaApplyRotation();
  const note = document.getElementById('qibla-note-text');
  if(note) note.textContent = 'وجّه أعلى هاتفك نحو السهم — السهم يشير إلى الكعبة المشرفة';
}
function qiblaEnableCompass(){
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state === 'granted'){
        window.addEventListener('deviceorientation', qiblaOrientationHandler);
      }else{
        toast('لم يتم منح إذن البوصلة');
      }
    }).catch(()=>toast('تعذر تفعيل البوصلة على هذا الجهاز'));
  }else if('ondeviceorientationabsolute' in window){
    window.addEventListener('deviceorientationabsolute', qiblaOrientationHandler);
  }else if('DeviceOrientationEvent' in window){
    window.addEventListener('deviceorientation', qiblaOrientationHandler);
  }else{
    toast('البوصلة غير مدعومة على هذا الجهاز');
  }
}

function ruqyahSetReciter(id){
  DB.settings.ruqyahReciter = id;
  saveDB();
  renderCurrentScreen();
}
let _ruqyahPlaylist = null;
let _ruqyahPlaylistIdx = 0;
let _ruqyahSpeakingDuaIdx = -1;
const RUQYAH_PLAYLIST_ORDER = [
  {type:'surah', num:1},
  {type:'surah', num:2},
  {type:'surah', num:112},
  {type:'surah', num:113},
  {type:'surah', num:114},
  {type:'surah', num:20},
  {type:'dua', idx:0},
  {type:'dua', idx:1},
  {type:'dua', idx:2},
  {type:'dua', idx:3},
];

function ruqyahAdvance(){
  _ruqyahPlaylistIdx++;
  if(_ruqyahPlaylist && _ruqyahPlaylistIdx < _ruqyahPlaylist.length){
    ruqyahPlayStep(_ruqyahPlaylist[_ruqyahPlaylistIdx]);
    if(isRuqyahView()) renderCurrentScreen();
  }else{
    _ruqyahPlaylist = null;
    _ruqyahSpeakingDuaIdx = -1;
    if(isRuqyahView()){ toast('تمت تلاوة الرقية كاملة'); renderCurrentScreen(); }
  }
}
function ruqyahLoadAndPlay(num){
  const audio = document.getElementById('ruqyah-audio');
  if(!audio) return;
  _ruqyahSpeakingDuaIdx = -1;
  const reciter = DB.settings.ruqyahReciter;
  audio.dataset.playing = String(num);
  playAudioWithBitrateFallback(audio, reciter, num,
    null,
    ()=>{ toast('تعذر تشغيل الصوت، تحقق من الاتصال بالإنترنت'); ruqyahStopAll(); }
  );
}
function ruqyahSpeakDua(idx){
  const dua = RUQYAH_DUAS[idx];
  const audio = document.getElementById('ruqyah-audio');
  if(audio){ audio.pause(); audio.dataset.playing = ''; }
  if(!dua){ ruqyahAdvance(); return; }
  _ruqyahSpeakingDuaIdx = idx;
  if(!('speechSynthesis' in window)){
    if(isRuqyahView()) renderCurrentScreen();
    setTimeout(()=>{ if(_ruqyahPlaylist) ruqyahAdvance(); }, 5000);
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(dua.text);
  utter.lang = 'ar-SA';
  utter.rate = 0.85;
  utter.onend = ()=>{ if(_ruqyahPlaylist) ruqyahAdvance(); };
  utter.onerror = ()=>{ if(_ruqyahPlaylist) ruqyahAdvance(); };
  window.speechSynthesis.speak(utter);
  if(isRuqyahView()) renderCurrentScreen();
}
function ruqyahPlayStep(item){
  if(item.type === 'surah') ruqyahLoadAndPlay(item.num);
  else ruqyahSpeakDua(item.idx);
}
function ruqyahPlayAll(){
  _ruqyahPlaylist = RUQYAH_PLAYLIST_ORDER.slice();
  _ruqyahPlaylistIdx = 0;
  ruqyahPlayStep(_ruqyahPlaylist[0]);
  renderCurrentScreen();
}
function ruqyahStopAll(){
  _ruqyahPlaylist = null;
  _ruqyahSpeakingDuaIdx = -1;
  const audio = document.getElementById('ruqyah-audio');
  if(audio){ audio.pause(); audio.currentTime = 0; audio.dataset.playing = ''; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  renderCurrentScreen();
}
function ruqyahToggleAll(){
  if(_ruqyahPlaylist) ruqyahStopAll();
  else ruqyahPlayAll();
}
function ruqyahPlaySurah(num){
  _ruqyahPlaylist = null;
  _ruqyahSpeakingDuaIdx = -1;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  const audio = document.getElementById('ruqyah-audio');
  if(!audio) return;
  if(audio.dataset.playing === String(num) && !audio.paused){
    audio.pause();
    audio.currentTime = 0;
    audio.dataset.playing = '';
    renderCurrentScreen();
    return;
  }
  ruqyahLoadAndPlay(num);
  renderCurrentScreen();
}

const FORYOU_STATE = { videos: [], stats: {}, loading: false, loaded: false, error: false };
async function loadForYouContent(force){
  if(FORYOU_STATE.loading) return;
  if(FORYOU_STATE.loaded && !force) return;
  FORYOU_STATE.loading = true;
  FORYOU_STATE.error = false;
  if(DB.ui.tab === 'foryou') renderCurrentScreen();
  try{
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const data = await Promise.race([window.__fbSync.pull('foryou_content'), timeout]);
    FORYOU_STATE.videos = (data && Array.isArray(data.videos)) ? data.videos : [];
    FORYOU_STATE.stats = (data && data.stats && typeof data.stats === 'object') ? data.stats : {};
    FORYOU_STATE.loaded = true;
  }catch(e){
    FORYOU_STATE.error = true;
  }
  FORYOU_STATE.loading = false;
  if(DB.ui.tab === 'foryou') renderCurrentScreen();
  updateForYouBadge();
}
  await window.__fbSync.push('foryou_content', { videos: FORYOU_STATE.videos }, true);
}

function foryouFormatCount(n){
  n = n || 0;
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + (isEn()?'M':'م');
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + (isEn()?'K':'ألف');
  return String(n);
}
function foryouIsLiked(vid){
  DB.foryouLikes = DB.foryouLikes || {};
  return !!DB.foryouLikes[vid];
}
async function foryouToggleLike(vid){
  DB.foryouLikes = DB.foryouLikes || {};
  const nowLiked = !DB.foryouLikes[vid];
  if(nowLiked) DB.foryouLikes[vid] = true;
  else delete DB.foryouLikes[vid];
  saveDB();
  FORYOU_STATE.stats[vid] = FORYOU_STATE.stats[vid] || {};
  FORYOU_STATE.stats[vid].likes = (FORYOU_STATE.stats[vid].likes || 0) + (nowLiked ? 1 : -1);

  // تحديث زر الإعجاب في مكانه فقط بدل إعادة رسم الفيد كامل (اللي كان يرجّع المستخدم لأول فيديو)
  const item = document.querySelector(`.foryou-item[data-vid="${vid}"]`);
  if(item){
    const btn = item.querySelector('.foryou-action-btn');
    if(btn){
      btn.classList.toggle('liked', nowLiked);
      const icon = btn.querySelector('.foryou-action-icon');
      if(icon) icon.innerHTML = heartIcon(20, nowLiked);
      const count = btn.querySelector('.foryou-action-count');
      if(count) count.textContent = foryouFormatCount(FORYOU_STATE.stats[vid].likes);
    }
  }

  await window.__fbSync.bumpStat('foryou_content', vid, 'likes', nowLiked ? 1 : -1);
}
async function foryouRegisterView(vid){
  _foryouViewedThisSession = _foryouViewedThisSession || {};
  if(!_foryouViewedThisSession[vid]){
    _foryouViewedThisSession[vid] = true;
    FORYOU_STATE.stats[vid] = FORYOU_STATE.stats[vid] || {};
    FORYOU_STATE.stats[vid].views = (FORYOU_STATE.stats[vid].views || 0) + 1;
    const counters = document.querySelectorAll(`.foryou-item[data-vid="${vid}"] .foryou-action-btn .foryou-action-count`);
    if(counters[1]) counters[1].textContent = foryouFormatCount(FORYOU_STATE.stats[vid].views);
    await window.__fbSync.bumpStat('foryou_content', vid, 'views', 1);
  }
  // تعليم هذا المقطع كـ"مُشاهَد" على هذا الجهاز، لتحديث شارة عدد الفيديوهات الجديدة غير المُشاهَدة
  DB.foryouSeen = DB.foryouSeen || {};
  if(!DB.foryouSeen[vid]){
    DB.foryouSeen[vid] = true;
    saveDB();
    updateForYouBadge();
  }
}
function foryouUnseenCount(){
  DB.foryouSeen = DB.foryouSeen || {};
  const activeVideos = (FORYOU_STATE.videos || []).filter(v => v.active !== false);
  let count = 0;
  activeVideos.forEach((v, i) => {
    const vid = v.id || ('idx' + i);
    if(!DB.foryouSeen[vid]) count++;

  return count;
}

let _foryouObserver = null;
let _foryouViewedThisSession = {};
function after_foryou(){
  const feed = document.getElementById('foryou-feed');
  if(!feed) return;
  if(_foryouObserver) _foryouObserver.disconnect();
  const videos = Array.from(feed.querySelectorAll('video'));
  _foryouObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const v = entry.target;
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        v.currentTime = v.currentTime || 0;
        v.play().catch(() => {});
        if(v.dataset.vid) foryouRegisterView(v.dataset.vid);
      }else{
        v.pause();
      }
    });
  }, { root: feed, threshold: [0, 0.6, 1] });
  videos.forEach(v => {
    v.muted = _foryouMuted;
    _foryouObserver.observe(v);
    v.addEventListener('click', () => { v.paused ? v.play().catch(()=>{}) : v.pause(); });
  });
  if(videos[0]){
    videos[0].play().catch(() => {});
    if(videos[0].dataset.vid) foryouRegisterView(videos[0].dataset.vid);
  }
}

let _adminAddMode = 'url';
function adminSetAddMode(mode){
  _adminAddMode = mode;
  const urlFields = document.getElementById('admin-url-fields');
  const fileFields = document.getElementById('admin-file-fields');
  const btnUrl = document.getElementById('admin-mode-url');
  const btnFile = document.getElementById('admin-mode-file');
  if(urlFields) urlFields.style.display = mode === 'url' ? 'block' : 'none';
  if(fileFields) fileFields.style.display = mode === 'file' ? 'block' : 'none';
  if(btnUrl){ btnUrl.style.background = mode === 'url' ? 'var(--gold-500)' : 'var(--green-100)'; btnUrl.style.color = mode === 'url' ? 'var(--green-900)' : 'var(--text)'; }
  if(btnFile){ btnFile.style.background = mode === 'file' ? 'var(--gold-500)' : 'var(--green-100)'; btnFile.style.color = mode === 'file' ? 'var(--green-900)' : 'var(--text)'; }
}
async function adminAddVideo(){
  const titleInp = document.getElementById('admin-new-title');
  const title = titleInp ? titleInp.value.trim() : '';
  const btn = document.getElementById('admin-publish-btn');

  let url = '';
  if(_adminAddMode === 'url'){
    const urlInp = document.getElementById('admin-new-url');
    url = urlInp ? urlInp.value.trim() : '';
    if(!url){ toast('لازم تحط رابط الفيديو'); return; }
  }else{
    const fileInp = document.getElementById('admin-new-file');
    const file = fileInp && fileInp.files && fileInp.files[0];
    if(!file){ toast('لازم تختار فيديو من جهازك'); return; }
    if(!window.__fbStorage){ toast('خدمة الرفع غير متوفرة'); return; }
    const statusEl = document.getElementById('admin-upload-status');
    if(statusEl) statusEl.textContent = 'جاري الرفع… 0%';
    if(btn){ btn.disabled = true; btn.textContent = 'جاري الرفع… 0%'; }
    const result = await window.__fbStorage.uploadVideo(file, (pct)=>{
      if(statusEl) statusEl.textContent = `جاري الرفع… ${pct}%`;
      if(btn) btn.textContent = `جاري الرفع… ${pct}%`;
    });
    if(btn){ btn.disabled = false; btn.textContent = 'نشر المقطع'; }
    if(!result.ok){
      if(statusEl) statusEl.textContent = '';
      toast('فشل رفع الفيديو: ' + (result.error || 'خطأ غير معروف'));
      return;
    }
    url = result.url;
    if(statusEl) statusEl.textContent = '';
  }

  FORYOU_STATE.videos.unshift({ id: Date.now().toString(), url, title, active: true });
  renderAdminPanel();
  await saveForYouContent();
  toast('تم النشر');
}
async function adminDeleteVideo(idx){
  FORYOU_STATE.videos.splice(idx, 1);
  renderAdminPanel();
  await saveForYouContent();
}
async function adminToggleActive(idx){
  FORYOU_STATE.videos[idx].active = FORYOU_STATE.videos[idx].active === false;
  renderAdminPanel();
  await saveForYouContent();
}

async function requestNotifPermission(){
  if(!('Notification' in window)){ toast('الإشعارات غير مدعومة على هذا المتصفح'); return; }
  if(!isStandalone() && isIOS()){
    toast('ثبّت التطبيق على الشاشة الرئيسية أولاً لتفعيل الإشعارات');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') toast('لم يتم منح إذن الإشعارات');
}
function localNotify(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, {body, icon:'icons/icon-192.png'}); }catch(e){}
  }
}

let _notifFired = {};
function notifTick(){
  const now = new Date();
  const dk = todayKey(now);
  if(_notifFired.day !== dk){ _notifFired = {day:dk}; }
  const hm = pad2(now.getHours())+':'+pad2(now.getMinutes());

  if(DB.settings.notifMorning && PRAYER.timings){
    const t = parsePrayerTime(PRAYER.timings.Fajr, now);
    if(now >= t && now - t < 60000 && !_notifFired.morning){
      _notifFired.morning = true;
      localNotify('أذكار الصباح', 'حان وقت أذكار الصباح 🌅');
    }
  }
  if(DB.settings.notifEvening && PRAYER.timings){
    const t = parsePrayerTime(PRAYER.timings.Asr, now);
    if(now >= t && now - t < 60000 && !_notifFired.evening){
      _notifFired.evening = true;
      localNotify('أذكار المساء', 'حان وقت أذكار المساء 🌇');
    }
  }
  if(DB.settings.notifPreAdhan && PRAYER.timings){
    const mins = DB.settings.preAdhanMinutes || 10;
    NEXT_ORDER.forEach(key=>{
      const t = parsePrayerTime(PRAYER.timings[key], now);
      const diff = (t - now)/60000;
      const flag = 'pre_'+key;
      if(diff <= mins && diff > mins-1 && !_notifFired[flag]){
        _notifFired[flag] = true;
        localNotify('اقترب وقت الصلاة', `${prayerLabel(key)} بعد ${mins} دقائق`);
      }
    });
  }
  if(DB.settings.adhanAutoPlay && PRAYER.timings){
    NEXT_ORDER.forEach(key=>{
      if(key === 'Sunrise') return;
      const t = parsePrayerTime(PRAYER.timings[key], now);
      const flag = 'adhan_'+key;
      if(now >= t && now - t < 60000 && !_notifFired[flag]){
        _notifFired[flag] = true;
        localNotify('حان وقت الصلاة', prayerLabel(key));
        playAdhanAuto(key);
      }
    });
  }
  if(DB.settings.notifHourlyIstighfar){
    if(now.getMinutes()===0 && !_notifFired['hour'+now.getHours()]){
      _notifFired['hour'+now.getHours()] = true;
      localNotify('تذكير', 'أستغفر الله وأتوب إليه 📿');
    }
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60000);
    }).catch(()=>{});
  });
}

    <div class="ig-instructions" style="margin-top:14px">
      ${isIOS()
        ? 'من متصفح Safari: اضغط زر المشاركة ⬆️ بالأسفل، ثم مرّر لأسفل واختر "إضافة إلى الشاشة الرئيسية".'
        : 'من قائمة المتصفح (⋮ أعلى الصفحة) اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"، ثم افتحه من الأيقونة الجديدة.'}
    </div>`;
}
function bootApp(){
  applyTheme();
  applyLangDir();
  renderShell();
  applyFontScale();
  loadForYouContent();
}
bootApp();
setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('splash-hide');
    setTimeout(()=>splash.remove(), 550);
  }
}, 900);
</script>
</body>
</html>
